function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}
function months(){const o=[];let[y,m]=S.res.start.split("-").map(Number);while(y+"-"+String(m).padStart(2,"0")<=CM){o.push(y+"-"+String(m).padStart(2,"0"));if(++m>12){m=1;y++}}return o}
const U=n=>S.units.find(u=>u.n==n),partial=(u,m)=>S.pays.filter(p=>p.unit==u.n&&p.month==m&&p.part).reduce((a,p)=>a+p.amount,0),paid=(u,m)=>S.pays.some(p=>p.unit==u.n&&p.month==m&&!p.part)||partial(u,m)>=ufee(u),late=u=>u.ex?[]:months().filter(m=>!paid(u,m));

$("nav").innerHTML=[["📊","الرئيسية"],["🏢","الشقق"],["🧾","المصاريف"],["📄","التقارير"]].map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};render()"><b>${t[0]}</b>${t[1]}</button>`).join("");

يس الجلسة","كاتب الجلسة","وكيل الاتحاد","نائب الوكيل"])}`,

me.</p><p>The agent waives any fee or salary for his work, except expenses related to managing the association's affairs.</p><h3 style="text-align:left">III. Closing of the minutes</h3><p>The session was adjourned after the minutes were read and approved.</p>${sigT(["Chair","Secretary","Association agent","Deputy agent"])}`),g)}

const ttlOf=s=>{const m=String(s).match(/<h[23][^>]*>(.*?)<\/h[23]>/);return m?m[1]:""};
function snapH(){const sh=$("sh");sh.querySelectorAll("input,textarea,select").forEach(e=>{if(e.tagName=="TEXTAREA")e.textContent=e.value;else if(e.tagName=="SELECT")[...e.options].forEach(o=>o.toggleAttribute("selected",o.selected));else if(e.type=="checkbox"||e.type=="radio")e.toggleAttribute("checked",e.checked);else if(e.type!="file")e.setAttribute("value",e.value)});return sh.innerHTML}
function synBack(){if(!$("lk").hidden)return false;if(!$("md").hidden){if(mst.length)$("sh").innerHTML=mst.pop();else hide();return true}if(tab!=0){tab=0;render();return true}return false}
let curDoc=null;
function nextNo(){const y=TD.slice(0,4);return y+"/"+String(((S.dseq||{})[y]||0)+1).padStart(3,"0")}
function issueDoc(){if(!curDoc||curDoc.issued)return;curDoc.issued=true;S.dseq=S.dseq||{};const y=curDoc.no.split("/")[0];S.dseq[y]=(S.dseq[y]||0)+1;S.dlog=S.dlog||[];S.dlog.push({id:++S.seq,no:curDoc.no,title:curDoc.title,date:TD});save()}
function dlogView(){const y=TD.slice(0,4),L=(S.dlog||[]).slice().reverse();show(`<h3>🧾 سجل الوثائق الصادرة</h3><label>آخر رقم صدر هذه السنة (${y})</label><input id="dsq" type="number" value="${(S.dseq&&S.dseq[y])||0}"><button class="btn s bl" onclick="dseqSave()">حفظ</button>${L.map(d=>`<div class="row"><span class="ch ex">${d.no}</span><div class="f">${esc(d.title||"—")}<small>${d.date}</small></div></div>`).join("")||"<small>لا توجد وثائق صادرة</small>"}`)}
function dseqSave(){const y=TD.slice(0,4);S.dseq=S.dseq||{};S.dseq[y]=Math.max(0,+$("dsq").value||0);save();dlogView();toast("تم")}
const PH="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const IS=v=>v&&String(v).startsWith("i:")?`src="${PH}" data-ref="${v}"`:`src="${v}"`;
let _idb=null;const idb=()=>_idb||(_idb=new Promise((res,rej)=>{const r=indexedDB.open("syndic_media",1);r.onupgradeneeded=()=>r.result.createObjectStore("i");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const imgPut=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("i","readwrite");t.objectStore("i").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const imgGet=async k=>{const d=await idb();return new Promise(res=>{const q=d.transaction("i").objectStore("i").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})};
const imgDel=async k=>{try{const d=await idb();d.transaction("i","readwrite").objectStore("i").delete(k)}catch(e){}};
async function imgStore(v){if(!v)return null;if(String(v).startsWith("i:"))return v;try{const id="i:"+(++S.seq).toString(36)+Date.now().toString(36);await imgPut(id,v);return id}catch(e){return v}}
async function hydrate(){const L=[...document.querySelectorAll("img[data-ref]")];for(const el of L){const r=el.getAttribute("data-ref");el.removeAttribute("data-ref");const v=await imgGet(r);if(v)el.src=v}}
window.synHydrate=hydrate;let hq=0;new MutationObserver(()=>{if(hq)return;hq=requestAnimationFrame(()=>{hq=0;hydrate()})}).observe(document.body,{childList:true,subtree:true});
async function migrateImgs(){let ch=false;for(const x of S.exps.concat(S.docs||[])){if(x.img&&String(x.img).startsWith("data:")){const r=await imgStore(x.img);if(r!==x.img){x.img=r;ch=true}}}if(ch){save();render()}}
async function imgFull(){const c=JSON.parse(JSON.stringify(S));for(const x of c.exps.concat(c.docs||[])){if(x.img&&String(x.img).startsWith("i:")){x.img=(await imgGet(x.img))||null}}return JSON.stringify(c)}
const b64=u=>{u=new Uint8Array(u);let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dk(pw,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encBk(txt,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),it=200000,key=await dk(pw,salt,it),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(txt));return JSON.stringify({syndic:2,enc:"aes-256-gcm",kdf:"pbkdf2-sha256",iter:it,salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function decBk(o,pw){const key=await dk(pw,ub(o.salt),o.iter),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.iv)},key,ub(o.data));return new TextDecoder().decode(pt)}
function bkForm(){show(`<h3>🔐 نسخة احتياطية</h3><label>كلمة السر (اتركها فارغة لنسخة غير مشفرة)</label><input id="bpw" type="password" autocomplete="new-password"><label>تأكيد كلمة السر</label><input id="bp2" type="password" autocomplete="new-password"><label style="display:block;color:var(--tx);margin:6px 0"><input type="checkbox" id="bim" checked style="width:auto;margin:0 0 0 6px">تضمين صور الفواتير والوثائق</label><label style="display:block;color:var(--tx);margin:6px 0"><input type="checkbox" id="bnc" style="width:auto;margin:0 0 0 6px">بدون أرقام CIN (للمشاركة؛ لا تصلح للاسترجاع الكامل)</label><div class="al wn">إن نسيت كلمة السر فلا يمكن استرجاع النسخة المشفرة. احتفظ بها في مكان آمن.</div><button class="btn bl" onclick="bkRun()">إنشاء النسخة ومشاركتها</button>`)}
async function bkRun(){const pw=$("bpw").value,nc=$("bnc").checked;if(pw&&pw.length<6)return toast("كلمة السر 6 أحرف على الأقل");if(pw!==$("bp2").value)return toast("كلمتا السر غير متطابقتين");toast("جارٍ الإنشاء...");
 try{const c=JSON.parse($("bim").checked?await imgFull():JSON.stringify(S));if(!$("bim").checked)c.exps.concat(c.docs||[]).forEach(x=>{x.img=null});if(nc){c.units.forEach(u=>{u.cin=""});(c.hist||[]).forEach(h=>{h.cin=""})}
 let t=JSON.stringify(c);if(pw)t=await encBk(t,pw);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download="syndic-backup-"+TD+(pw?"-enc":"")+(nc?"-nocin":"")+".json";a.click();if(!nc){S.res.lastBackup=TD;save()}hide();render()}catch(e){toast("تعذّر: "+e)}}
let impEnc=null;
function impDec(){decBk(impEnc,$("ipw").value).then(t=>restoreApply(JSON.parse(t))).catch(()=>toast("كلمة السر خاطئة أو الملف تالف"))}
function restoreApply(d){if(!d.units||!d.res){toast("ملف غير صالح");return}if(!confirm("سيتم استبدال البيانات الحالية. متابعة؟"))return;S=d;save();hide();render();migrateImgs();toast("تم الاسترجاع")}
function setForm(){const r=S.res;show(`<h3>إعدادات الإقامة</h3><label>🌐 اللغة / Language</label><select onchange="setUI(this.value)">${lo(UIL)}</select><label>🔠 حجم الخط</label><select onchange="setFS(this.value)"><option value="1" ${(localStorage.getItem("syndic_fs")||"1")=="1"?"selected":""}>عادي</option><option value="1.15" ${localStorage.getItem("syndic_fs")=="1.15"?"selected":""}>كبير</option><option value="1.3" ${localStorage.getItem("syndic_fs")=="1.3"?"selected":""}>كبير جداً</option></select><label>🌓 المظهر</label><select onchange="setTheme(this.value)"><option value="" ${!localStorage.getItem("syndic_theme")?"selected":""}>تلقائي</option><option value="light" ${localStorage.getItem("syndic_theme")=="light"?"selected":""}>فاتح</option><option value="dark" ${localStorage.getItem("syndic_theme")=="dark"?"selected":""}>داكن</option></select><label>اسم الإقامة</label><input id="sn" value="${esc(r.name)}"><label>اسم الإقامة (بالحروف اللاتينية)</label><input id="snl" value="${esc(r.nameL||"")}"><label>المدينة</label><input id="sc" value="${esc(r.city)}"><label>المدينة (بالحروف اللاتينية)</label><input id="scl" value="${esc(r.cityL||"")}"><label>عنوان الإقامة</label><input id="sad" value="${esc(r.addr||"")}" placeholder="تجزئة لوتيبر شارع ميضار"><label>اسم السانديك</label><input id="ss" value="${esc(r.syn)}"><label>اسم السانديك (بالحروف اللاتينية)</label><input id="ssl" value="${esc(r.synL||"")}"><label>الاشتراك الشهري (درهم)</label><input id="sf" type="number" value="${r.fee}"><label>بداية التتبع (شهر)</label><input id="st" type="month" value="${r.start}"><label>اسم الاتحاد (للدمغ)</label><input id="su" value="${esc(r.union||"")}" placeholder="اتحاد الملاك المشتركين - عاليا 3"><label>اسم الاتحاد (بالحروف اللاتينية)</label><input id="sul" value="${esc(r.unionL||"")}" placeholder="Syndicat des copropriétaires - Aliya 3"><label>الرصيد الافتتاحي في الصندوق (درهم)</label><input id="so" type="number" value="${r.open||0}"><label>رمز PIN لقفل التطبيق (4-8 أرقام)${r.pin?" - مفعّل":""}</label><input id="sp" type="password" inputmode="numeric" placeholder="اتركه فارغاً بدون تغيير">${r.pin?`<label><input type="checkbox" id="sx" style="width:auto;margin:0 0 0 6px">إلغاء الرمز</label>`:""}<label>يوم الفحص الشهري للمصعد</label><input id="se" type="number" min="1" max="28" value="${r.elev}"><button class="btn bl" onclick="saveSet()">حفظ</button><button class="btn s bl" onclick="exportData()">⬇️ نسخة احتياطية (تنزيل ملف)</button><button class="btn s bl" onclick="shareBackup()">📤 مشاركة النسخة الاحتياطية (Drive / واتساب)</button><button class="btn s bl" onclick="$('imp').click()">⬆️ استرجاع نسخة احتياطية</button><input id="imp" type="file" accept=".json" hidden onchange="importData(this)">`)}
function saveSet(){const pv=$("sp").value.trim();if(pv&&!/^\d{4,8}$/.test(pv))return toast("الرمز 4 إلى 8 أرقام");if(pv)S.res.pin=hp(pv);if($("sx")&&$("sx").checked)delete S.res.pin;Object.assign(S.res,{addr:$("sad").value.trim(),unionL:$("sul").value.trim(),nameL:$("snl").value.trim(),cityL:$("scl").value.trim(),synL:$("ssl").value.trim(),union:$("su").value.trim(),open:+$("so").value||0,name:$("sn").value||"الإقامة",city:$("sc").value,syn:$("ss").value,fee:+$("sf").value||150,start:$("st").value||CM,elev:Math.min(28,Math.max(1,+$("se").value||25))});save();hide();render()}

function exportData(){bkForm()}
function importData(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.enc){impEnc=d;show(`<h3>🔐 نسخة مشفّرة</h3><label>كلمة السر</label><input id="ipw" type="password"><button class="btn bl" onclick="impDec()">فك التشفير</button>`);return}restoreApply(d)}catch(e){toast("ملف غير صالح")}};r.readAsText(f)}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();if(S.res.pin)lockShow();migrateImgs();
</script></body></html>
