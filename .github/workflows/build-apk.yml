name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: bash patch-android.sh
      - run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - name: Build APK (with retries)
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon --refresh-dependencies \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000 && exit 0
            echo "Attempt $i failed, retrying in 40s..."
            sleep 40
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: syndic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
